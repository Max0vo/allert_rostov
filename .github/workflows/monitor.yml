name: Telegram Danger Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # Запуск скрипта каждые 5 минут автоматикой GitHub
  workflow_dispatch:      # Кнопка ручного запуска в интерфейсе GitHub

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        run: |
          python main.py
