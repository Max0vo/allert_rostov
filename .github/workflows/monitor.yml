name: Telegram Danger Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # Запуск скрипта каждые 5 минут
  workflow_dispatch:      # Кнопка ручного запуска

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    
    # Даем права на запись в репозиторий, чтобы сохранять состояние
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IOS_WEBHOOK_URL: ${{ secrets.IOS_WEBHOOK_URL }}
        run: |
          python main.py

      - name: Save state changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto: update monitor state [skip ci]"
          file_pattern: monitor_state.json
